name: CI

# `doigtes` est bloquant et ne se contourne jamais (CLAUDE.md §11) : un mauvais
# doigté qui passe en production est un dommage réel pour l'utilisateur.
#
# Le déploiement passe par ce pipeline, et JAMAIS par l'intégration Git native
# de Cloudflare Pages. Celle-ci construirait le site directement depuis le dépôt
# et court-circuiterait le test de doigtés. La tentation est forte sur GitHub,
# où l'intégration se branche en deux clics : ne pas le faire.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée annule le pipeline en cours sur la même référence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # ------------------------------------------------------------------ qualité

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  # Isolé dans son propre job pour être lisible d'un coup d'œil dans la liste
  # des exécutions : c'est l'invariant qu'on regarde en premier.
  doigtes:
    name: doigtés (I1 — bloquant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx vitest run test/fingering.spec.ts

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  # ------------------------------------------------------------------ build

  build:
    needs: [types, doigtes, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Publiques : elles finissent dans le HTML. Ce sont des « Variables »
          # de dépôt, pas des « Secrets ».
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_UMAMI_URL: ${{ vars.PUBLIC_UMAMI_URL }}
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
          PUBLIC_EMAIL_ENDPOINT: ${{ vars.PUBLIC_EMAIL_ENDPOINT }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ------------------------------------------------------------- vérification

  # I2 — le contenu pédagogique doit être présent dans le HTML servi, JS désactivé.
  sans-js:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm run verif:sansjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_UMAMI_URL: ${{ vars.PUBLIC_UMAMI_URL }}
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}

  # Les parcours tournent contre `wrangler pages dev`, pas contre un serveur
  # statique : c'est la seule façon d'exercer aussi la fonction d'inscription,
  # qui porte le signal de décision de la phase 1.
  parcours:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium

      - name: Base D1 locale
        run: npx wrangler d1 execute cinqnotes --local --file=migrations/0001_inscriptions.sql

      - name: Servir le site et ses fonctions
        run: |
          npx wrangler pages dev dist --port 4321 --ip 127.0.0.1 > wrangler.log 2>&1 &
          npx wait-on http://127.0.0.1:4321 --timeout 90000

      - run: npx playwright test
        env:
          BASE_URL: http://127.0.0.1:4321
          PUBLIC_EMAIL_ENDPOINT: ${{ vars.PUBLIC_EMAIL_ENDPOINT }}

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            wrangler.log
          retention-days: 7

  # Budget de performance : perf ≥ 90, a11y ≥ 95 (CLAUDE.md §8 phase 0).
  # Une partie des utilisateurs pratique le soir, sur un vieux téléphone.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npm i -g @lhci/cli
      - name: Servir le site
        run: |
          npx serve dist -l 4321 > /dev/null 2>&1 &
          npx wait-on http://127.0.0.1:4321 --timeout 60000
      - run: |
          lhci autorun \
            --collect.url=http://127.0.0.1:4321/ \
            --collect.url=http://127.0.0.1:4321/routine/lundi \
            --collect.url=http://127.0.0.1:4321/impro/melancolique-la

  # ------------------------------------------------------------- déploiement

  deploiement:
    # On déploie l'artefact que les trois jobs de vérification ont contrôlé.
    # Reconstruire ici livrerait des octets que personne n'a vérifiés.
    needs: [sans-js, parcours, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx wrangler pages deploy dist --project-name=cinqnotes --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Chaque pull request obtient sa propre URL, ce qui permet de faire relire une
  # page avant de la fusionner.
  previsualisation:
    needs: [sans-js, parcours, lighthouse]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx wrangler pages deploy dist --project-name=cinqnotes --branch="pr-${{ github.event.number }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
