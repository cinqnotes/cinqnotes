name: Migration D1

# Les migrations ne s'appliquent pas toutes seules : une table absente ferait
# échouer silencieusement toutes les inscriptions, et le formulaire n'afficherait
# qu'une erreur générique. À lancer à la main après avoir ajouté une migration.
#
# Actions → Migration D1 → Run workflow.

on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Base à migrer"
        required: true
        default: remote
        type: choice
        options: [remote, local]

jobs:
  migrer:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Migrations en attente
        run: npx wrangler d1 migrations list cinqnotes --${{ inputs.cible }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Appliquer
        run: npx wrangler d1 migrations apply cinqnotes --${{ inputs.cible }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Vérifier que la table existe
        run: |
          npx wrangler d1 execute cinqnotes --${{ inputs.cible }} \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='inscriptions'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
