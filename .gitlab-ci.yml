# Pipeline de la phase 0.
# `test:fingering` est bloquant et ne se contourne jamais (CLAUDE.md §11) :
# un mauvais doigté qui passe en production est un dommage réel pour l'utilisateur.

stages:
  - qualite
  - build
  - verification
  - deploiement

default:
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

variables:
  # Surcharger dans les variables du projet au moment du déploiement.
  SITE_URL: "https://roadmap-piano.exemple"

# ---------------------------------------------------------------- qualité

types:
  stage: qualite
  script:
    - npm run check

# I1 — invariant bloquant, isolé dans son propre job pour être lisible d'un coup
# d'œil dans la liste des pipelines.
test:fingering:
  stage: qualite
  script:
    - npx vitest run test/fingering.spec.ts

test:unitaires:
  stage: qualite
  script:
    - npm test

# ---------------------------------------------------------------- build

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ---------------------------------------------------------------- vérification

# I2 — le contenu pédagogique doit être présent dans le HTML servi, JS désactivé.
verification:sans-js:
  stage: verification
  needs: ["build"]
  script:
    - npm run verif:sansjs

verification:parcours:
  stage: verification
  needs: ["build"]
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  script:
    - npx playwright test
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
    expire_in: 1 week

# Budget de performance : perf ≥ 90, a11y ≥ 95 (CLAUDE.md §8 phase 0).
# Une partie des utilisateurs pratique le soir, sur un vieux téléphone.
verification:lighthouse:
  stage: verification
  needs: ["build"]
  image: cypress/browsers:node-22.11.0-chrome-130.0.6723.69-1-ff-132.0-edge-130.0.2849.56-1
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npm i -g @lhci/cli
  script:
    - npx --yes serve dist -l 4321 &
    - npx --yes wait-on http://localhost:4321
    - lhci autorun --collect.url=http://localhost:4321 --collect.url=http://localhost:4321/routine/lundi --collect.url=http://localhost:4321/impro/melancolique-la
  allow_failure: false

# ---------------------------------------------------------------- déploiement

# L'hébergeur n'est pas encore tranché (Cloudflare Pages ou Netlify, CLAUDE.md §5).
# Le job existe pour que la marche à suivre soit écrite, il ne tourne pas encore.
deploiement:
  stage: deploiement
  needs: ["verification:sans-js", "verification:parcours", "verification:lighthouse"]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DEPLOY_TOKEN
  script:
    - echo "À câbler une fois l'hébergeur choisi (wrangler pages deploy / netlify deploy)."
