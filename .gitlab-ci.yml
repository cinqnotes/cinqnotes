# Pipeline de la phase 0.
# `test:fingering` est bloquant et ne se contourne jamais (CLAUDE.md §11) :
# un mauvais doigté qui passe en production est un dommage réel pour l'utilisateur.

stages:
  - qualite
  - build
  - verification
  - deploiement

default:
  image: node:24-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline

# SITE_URL, PUBLIC_UMAMI_URL, PUBLIC_UMAMI_ID, PUBLIC_EMAIL_ENDPOINT,
# CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID sont des variables de PROJET
# (Settings → CI/CD → Variables), pas des valeurs de ce fichier : y écrire un
# domaine bouchon a déjà failli envoyer `roadmap-piano.exemple` en production.
# Le contrôle `verification:sans-js` refuse désormais tout domaine en `.exemple`.

# ---------------------------------------------------------------- qualité

types:
  stage: qualite
  script:
    - npm run check

# I1 — invariant bloquant, isolé dans son propre job pour être lisible d'un coup
# d'œil dans la liste des pipelines.
test:fingering:
  stage: qualite
  script:
    - npx vitest run test/fingering.spec.ts

test:unitaires:
  stage: qualite
  script:
    - npm test

# ---------------------------------------------------------------- build

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ---------------------------------------------------------------- vérification

# I2 — le contenu pédagogique doit être présent dans le HTML servi, JS désactivé.
verification:sans-js:
  stage: verification
  needs: ["build"]
  script:
    - npm run verif:sansjs

verification:parcours:
  stage: verification
  needs: ["build"]
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  script:
    - npx playwright test
  artifacts:
    when: on_failure
    paths:
      - playwright-report/
    expire_in: 1 week

# Budget de performance : perf ≥ 90, a11y ≥ 95 (CLAUDE.md §8 phase 0).
# Une partie des utilisateurs pratique le soir, sur un vieux téléphone.
verification:lighthouse:
  stage: verification
  needs: ["build"]
  image: cypress/browsers:node-22.11.0-chrome-130.0.6723.69-1-ff-132.0-edge-130.0.2849.56-1
  before_script:
    - npm ci --cache .npm --prefer-offline
    - npm i -g @lhci/cli
  script:
    - npx --yes serve dist -l 4321 &
    - npx --yes wait-on http://localhost:4321
    - lhci autorun --collect.url=http://localhost:4321 --collect.url=http://localhost:4321/routine/lundi --collect.url=http://localhost:4321/impro/melancolique-la
  allow_failure: false

# ---------------------------------------------------------------- déploiement

# Le déploiement passe par la CI, et JAMAIS par l'intégration Git native de
# Cloudflare Pages : celle-ci construirait le site directement depuis le dépôt
# et court-circuiterait `test:fingering`. Garder `wrangler` ici, c'est garder
# I1 sur le chemin de la production.
.wrangler: &wrangler
  stage: deploiement
  # On déploie l'artefact du job `build`, celui-là même que les trois jobs de
  # vérification ont contrôlé. Reconstruire ici livrerait des octets que
  # personne n'a vérifiés.
  needs:
    - job: build
      artifacts: true
    - job: verification:sans-js
      artifacts: false
    - job: verification:parcours
      artifacts: false
    - job: verification:lighthouse
      artifacts: false

deploiement:
  <<: *wrangler
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN
  environment:
    name: production
    url: $SITE_URL
  script:
    - npx wrangler pages deploy dist --project-name=cinqnotes --branch=main

# Chaque branche obtient sa propre URL de prévisualisation, ce qui permet de
# faire relire une page avant de la fusionner.
previsualisation:
  <<: *wrangler
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN
  environment:
    name: previsualisation/$CI_COMMIT_REF_SLUG
    url: https://$CI_COMMIT_REF_SLUG.cinqnotes.pages.dev
  script:
    - npx wrangler pages deploy dist --project-name=cinqnotes --branch=$CI_COMMIT_REF_SLUG

# Les migrations D1 ne s'appliquent pas toutes seules : une table absente ferait
# échouer silencieusement toutes les inscriptions. À lancer manuellement après
# avoir ajouté une migration.
migration:d1:
  stage: deploiement
  needs: []
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CLOUDFLARE_API_TOKEN
  script:
    - npx wrangler d1 migrations apply cinqnotes --remote
